[package]
name = "trx-rs"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["python"]
resolver = "2"

[features]
default = ["parallel"]
# Enables rayon-parallel `apply_transform_in_place` over streamline points.
parallel = ["dep:rayon"]

[dependencies]
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
nifti = { version = "0.17", features = ["nalgebra_affine"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
itk-transforms-rs = { version = "0.1.0", git = "https://github.com/PennLINC/itk-transforms-rs" }
nalgebra = "0.33"
rayon = { version = "1", optional = true }

[dev-dependencies]
ureq = "3"
criterion = { version = "0.5", features = ["html_reports"] }
assert_cmd = "2"
predicates = "3"

[[bench]]
name = "trx_realdata"
harness = false
