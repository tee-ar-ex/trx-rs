name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build Rust API docs
        run: cargo doc --no-deps --target-dir target/rustdoc

      - name: Install Sphinx dependencies
        run: pip install -r docs/requirements.txt

      - name: Build Sphinx docs
        run: sphinx-build docs/ _build/html/

      - name: Embed cargo doc output
        run: |
          mkdir -p _build/html/api/rust
          cp -r target/rustdoc/doc/* _build/html/api/rust/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ github.event_name == 'pull_request'
            && format('github-pages-preview-{0}', github.event.number)
            || 'github-pages' }}
          path: _build/html/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5